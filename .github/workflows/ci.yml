name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install pinned nhsuk-frontend
        working-directory: upstream
        run: npm ci

      - name: Check generated files match the pinned upstream version
        working-directory: upstream
        run: npm run check

      - name: Build
        run: dotnet build NhsukFrontend.sln -c Release

      - name: Parity check against upstream fixtures
        run: dotnet run -c Release --no-build --project tools/NhsukFrontend.ParityCheck -- --verbose

      - name: Compile every documented Razor snippet
        run: |
          dotnet run -c Release --no-build --project tools/NhsukFrontend.ParityCheck -- --emit-snippets tools/NhsukFrontend.SnippetCheck/AllSnippets.razor
          dotnet build tools/NhsukFrontend.SnippetCheck -c Release

      - name: Publish as Heroku does
        run: dotnet publish NhsukFrontend.sln -c Release -p:PublishDir=bin/publish
