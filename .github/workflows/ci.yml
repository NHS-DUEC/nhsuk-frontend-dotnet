name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install pinned nhsuk-frontend
        working-directory: upstream
        run: npm ci

      - name: Check generated files match the pinned upstream version
        working-directory: upstream
        run: npm run check

      - name: Build
        run: dotnet build NhsukFrontend.sln -c Release

      # One test case per upstream example, for the components and again for the tag helpers,
      # plus model binding and validation tests.
      - name: Test
        run: dotnet test NhsukFrontend.sln -c Release --no-build --logger "console;verbosity=minimal" --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      - name: Parity report (readable HTML diffs for any failure)
        if: failure()
        run: |
          dotnet run -c Release --no-build --project tools/NhsukFrontend.ParityCheck -- --verbose || true
          dotnet run -c Release --no-build --project tools/NhsukFrontend.ParityCheck -- --tag-helpers --verbose

      - name: Compile every documented Razor and tag helper snippet
        run: |
          dotnet run -c Release --no-build --project tools/NhsukFrontend.ParityCheck -- --emit-snippets tools/NhsukFrontend.SnippetCheck/AllSnippets.razor
          dotnet build tools/NhsukFrontend.SnippetCheck -c Release

      - name: Publish as Heroku does
        run: dotnet publish NhsukFrontend.sln -c Release -p:PublishDir=bin/publish

      # Run the published site the way the Procfile does, then drive both example forms.
      - name: Smoke test the published site
        run: |
          (cd src/NhsukFrontend.Demo/bin/publish && ./NhsukFrontend.Demo --urls http://127.0.0.1:5000 > /tmp/site.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/healthz > /dev/null && break; sleep 1; done
          tools/smoke-test.sh http://127.0.0.1:5000 || { cat /tmp/site.log; exit 1; }
