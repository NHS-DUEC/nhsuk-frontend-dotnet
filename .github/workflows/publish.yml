name: Publish to NuGet

# Publishes the package to nuget.org when a GitHub release is published.
#
# Uses nuget.org Trusted Publishing: GitHub proves which repository and workflow is running, and nuget.org
# hands back an API key that lasts an hour. There is no long-lived API key to store or rotate.
# One-off setup is described in CONTRIBUTING.md ("Releasing"). The trusted publishing policy on nuget.org
# names this file (publish.yml), so renaming it means updating the policy.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub issue the token nuget.org checks

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test NhsukFrontend.sln -c Release --logger "console;verbosity=minimal"

      # Pack the package, install it into a brand-new Razor Pages app, publish and check it works.
      - name: Install the package into a new app
        run: tools/package-test.sh

      - name: Pack
        run: dotnet pack src/NhsukFrontend.Components -c Release -o artifacts

      # The release tag must be the package version with a "v" in front (v10.7.2-beta.1), so a release
      # can never publish a version other than the one it is named after.
      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(dotnet msbuild src/NhsukFrontend.Components -getProperty:PackageVersion)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag '$TAG' does not match the package version. Expected 'v$version'. Change VersionSuffix in NhsukFrontend.Components.csproj, or re-create the release with the right tag."
            exit 1
          fi
          test -f "artifacts/nhsuk-frontend-dotnet.$version.nupkg"

      # Ask for the key only now: it lasts an hour and each run can ask once.
      - name: Sign in to nuget.org
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
